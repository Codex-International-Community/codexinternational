name: CI/CD Production Branch

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  backend-ci:
    name: Rust Format, Clippy, Test & Compose Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: codex_dev_password
          POSTGRES_DB: codexinternational
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codex -d codexinternational"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:9.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check formatting
        working-directory: backend
        run: cargo fmt --check

      - name: Run Clippy
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgres://codex:codex_dev_password@127.0.0.1:5432/codexinternational
          VALKEY_URL: valkey://127.0.0.1:6379
        run: cargo test --all-targets -- --include-ignored

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  deploy-prod:
    name: Deploy to VPS (prod)
    needs: [backend-ci, frontend-ci]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/prod' && vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy latest prod branch to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"
            git fetch origin prod
            git checkout prod
            git reset --hard origin/prod

            docker compose up -d --build

            cd "$APP_DIR/backend"
            cargo build --release
            sudo systemctl restart codexter-backend

            cd "$APP_DIR/frontend"
            npm ci
            npm run build

            curl -fsS http://127.0.0.1:8081/health/live > /dev/null
