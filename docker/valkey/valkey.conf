# Valkey 9.1 configuration for local development.
# Inside the container we listen on 0.0.0.0:6379 so Docker's port-forwarder
# can reach Valkey; LAN isolation is enforced on the host side via
# "127.0.0.1:6379:6379" in docker-compose.yml.
bind 0.0.0.0
protected-mode no
port 6379

# Multi-threaded I/O (Valkey 8/9+): offloads socket read/parse/write from the
# main command thread without excessive context-switching on 2-core hosts.
io-threads 2
io-threads-do-reads yes

# Memory cap + noeviction so write-behind streams apply backpressure instead of
# silently evicting queued messages or triggering the Linux OOM killer.
maxmemory 400mb
maxmemory-policy noeviction

# AOF persistence (INV-1): ensures acknowledged chat messages in stream:messages
# survive container restarts with at most ~1 second fsync window.
appendonly yes
appendfsync everysec
dir /data
