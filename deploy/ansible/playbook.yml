---
- name: Setup CodexInternational Project on Server
  hosts: codex_servers
  become: true

  vars:
    app_user: rallc
    project_dir: "/home/{{ app_user }}/projects/codexinternational"
    repo_url: "https://github.com/Codex-International-Community/codexinternational.git"
    repo_branch: "main"
    node_major_version: "24"

  tasks:
    - name: Apply kernel sysctl tuning for Valkey, PostgreSQL, and high-concurrency sockets
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-codexter-tuning.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          vm.overcommit_memory = 1
          vm.swappiness = 10
          net.core.somaxconn = 4096
          net.ipv4.tcp_max_syn_backlog = 4096
          fs.file-max = 100000
      notify: Reload sysctl

    - name: Install build and runtime dependencies
      ansible.builtin.apt:
        name:
          - git
          - curl
          - ca-certificates
          - gnupg
          - build-essential
          - pkg-config
          - libssl-dev
          - python3
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add app_user to docker group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: docker
        append: true

    - name: Install Caddy apt repository key and repo
      ansible.builtin.shell: |
        set -euo pipefail
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/caddy-stable.list

    - name: Install Caddy
      ansible.builtin.apt:
        name: caddy
        state: present
        update_cache: true

    - name: Install Node.js {{ node_major_version }}.x via NodeSource
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://deb.nodesource.com/setup_{{ node_major_version }}.x | bash -
      args:
        executable: /bin/bash
        creates: /etc/apt/sources.list.d/nodesource.list

    - name: Install nodejs package
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

    - name: Install Rust toolchain for app_user
      become_user: "{{ app_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      args:
        executable: /bin/bash
        creates: "/home/{{ app_user }}/.cargo/bin/cargo"

    - name: Ensure app_user home directory is traversable by Caddy
      ansible.builtin.file:
        path: "/home/{{ app_user }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0711"

    - name: Ensure secrets and backups directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "/home/{{ app_user }}/secrets", mode: "0700" }
        - { path: "/home/{{ app_user }}/backups/codexinternational", mode: "0750" }

    - name: Ensure project parent directory exists
      ansible.builtin.file:
        path: "{{ project_dir | dirname }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Clone or update repository
      become_user: "{{ app_user }}"
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: "{{ repo_branch }}"
        update: true

    - name: Check that .env exists before starting services
      ansible.builtin.stat:
        path: "{{ project_dir }}/.env"
      register: project_env_file

    - name: Fail if .env is missing
      ansible.builtin.assert:
        that:
          - project_env_file.stat.exists
        fail_msg: "Missing {{ project_dir }}/.env. Copy/create .env on the target server before running this playbook."

    - name: Compute dynamic PostgreSQL and Valkey tuning from host specs
      ansible.builtin.set_fact:
        pg_shared_buffers_mb: "{{ [256, (ansible_memtotal_mb * 0.20) | int] | max }}"
        pg_effective_cache_size_mb: "{{ [512, (ansible_memtotal_mb * 0.40) | int] | max }}"
        pg_maintenance_work_mem_mb: "{{ [64, [(ansible_memtotal_mb * 0.03) | int, 512] | min] | max }}"
        pg_work_mem_mb: "{{ 8 if ansible_memtotal_mb >= 4096 else 4 }}"
        pg_max_connections: "{{ 100 if ansible_memtotal_mb >= 4096 else 50 }}"
        valkey_maxmemory_mb: "{{ [256, [(ansible_memtotal_mb * 0.20) | int, 2048] | min] | max }}"
        valkey_io_threads: "{{ 1 if ansible_processor_vcpus <= 2 else ([ansible_processor_vcpus, 4] | min) }}"

    - name: Write dynamic resource tuning into .env
      ansible.builtin.blockinfile:
        path: "{{ project_dir }}/.env"
        marker: "# {mark} ANSIBLE MANAGED RESOURCE TUNING"
        block: |
          PG_SHARED_BUFFERS={{ pg_shared_buffers_mb }}MB
          PG_WORK_MEM={{ pg_work_mem_mb }}MB
          PG_MAINTENANCE_WORK_MEM={{ pg_maintenance_work_mem_mb }}MB
          PG_EFFECTIVE_CACHE_SIZE={{ pg_effective_cache_size_mb }}MB
          PG_MAX_CONNECTIONS={{ pg_max_connections }}
          VALKEY_MAXMEMORY={{ valkey_maxmemory_mb }}mb
          VALKEY_IO_THREADS={{ valkey_io_threads }}

    - name: Start PostgreSQL and Valkey via Docker Compose
      become_user: "{{ app_user }}"
      ansible.builtin.command:
        cmd: docker compose up -d --wait
        chdir: "{{ project_dir }}"
      changed_when: true

    - name: Install frontend dependencies and build SPA
      become_user: "{{ app_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        npm ci
        npm run build
      args:
        executable: /bin/bash
        chdir: "{{ project_dir }}/frontend"
      changed_when: true

    - name: Build Rust backend release binary
      become_user: "{{ app_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        export PATH="$HOME/.cargo/bin:$PATH"
        cargo build --release
      args:
        executable: /bin/bash
        chdir: "{{ project_dir }}/backend"
      changed_when: true

    - name: Install Caddyfile
      ansible.builtin.copy:
        src: "{{ project_dir }}/deploy/Caddyfile"
        dest: /etc/caddy/Caddyfile
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Reload Caddy

    - name: Install codexter-backend systemd service
      ansible.builtin.copy:
        src: "{{ project_dir }}/deploy/codexter-backend.service"
        dest: /etc/systemd/system/codexter-backend.service
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      notify: Restart codexter-backend

    - name: Enable and start Caddy
      ansible.builtin.systemd:
        name: caddy
        enabled: true
        state: started

    - name: Enable and start codexter-backend
      ansible.builtin.systemd:
        name: codexter-backend
        daemon_reload: true
        enabled: true
        state: started

    - name: Ensure seed-dev script is executable
      ansible.builtin.file:
        path: "{{ project_dir }}/deploy/ansible/seed-dev.sh"
        mode: "0750"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    - name: Seed dev role if target user already exists
      become_user: "{{ app_user }}"
      ansible.builtin.command:
        cmd: "{{ project_dir }}/deploy/ansible/seed-dev.sh"
      register: seed_dev_result
      changed_when: "'has platform_role=\\'dev\\'' in seed_dev_result.stdout"

    - name: Ensure backup script is executable
      ansible.builtin.file:
        path: "{{ project_dir }}/deploy/backup/backup-db.sh"
        mode: "0750"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"

    - name: Install codexter-db-backup systemd service and timer
      ansible.builtin.copy:
        src: "{{ project_dir }}/deploy/backup/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - codexter-db-backup.service
        - codexter-db-backup.timer

    - name: Enable and start codexter-db-backup timer
      ansible.builtin.systemd:
        name: codexter-db-backup.timer
        daemon_reload: true
        enabled: true
        state: started

  handlers:
    - name: Reload sysctl
      ansible.builtin.command:
        cmd: sysctl --system
      changed_when: true

    - name: Reload Caddy
      ansible.builtin.systemd:
        name: caddy
        state: reloaded

    - name: Restart codexter-backend
      ansible.builtin.systemd:
        name: codexter-backend
        daemon_reload: true
        state: restarted
