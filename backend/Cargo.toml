[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate"] }
fred = { version = "10.1.0", features = ["subscriber-client", "i-scripts", "i-sorted-sets"] }
uuid = { version = "1.29.2", features = ["v7", "v4", "serde"] }
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
subtle = "2"
async-trait = "0.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
